<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#287bb9"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><title>日有所成 · 成员记录</title></head><body>
<main><header><h1>✳ 日有所成</h1><p>一起记录，也一起回望。</p></header>
<section id="login"><h2>连接 GitHub</h2><p>每位成员使用自己的 GitHub 账号，以及只限共享仓库的细粒度令牌。请先由仓库所有者邀请成员加入共享私有仓库。</p><p>共享仓库中的所有成员都能查看记录；具有写权限的成员也可能直接修改其他人的文件。令牌仅发送给 GitHub，不要发给其他人。</p><form id="connect"><label>共享仓库 <input id="repo" placeholder="仓库所有者/仓库名" required autocomplete="off"></label><label>GitHub 令牌 <input id="token" type="password" required autocomplete="off"></label><label><input id="remember" type="checkbox"> 在此设备记住授权</label><button>连接并进入</button></form><p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">创建细粒度令牌 ↗</a>：选择共享仓库，Contents 权限设为 Read and write。</p><a href="../">返回原网页</a></section>
<section id="workspace" hidden><div class="row"><strong id="identity"></strong><button id="disconnect">退出</button></div><div class="row"><label>查看成员 <select id="members"></select></label><button id="refresh">刷新同步</button></div><p id="status" role="status"></p><p id="readonly" hidden>正在查看其他成员的记录，仅供查看。</p>
<div id="editor"><h2>记下一件完成</h2><form id="add"><label>日期 <input id="date" type="date" required></label><label>事项 <input id="title" maxlength="150" required></label><label>分类 <select id="category"><option>学习</option><option>工作</option><option>生活</option><option>健康</option><option>其他</option></select></label><label>耗时（分钟） <input id="minutes" type="number" min="0" max="1440" value="0"></label><button>保存</button></form><label>当天感想 <textarea id="reflection" maxlength="4000"></textarea></label><button id="save-note">保存感想</button><div class="row"><button id="import-original">迁移本浏览器原网页记录</button><button id="export">导出我的备份</button></div></div>
<h2>记录回顾</h2><div id="records"></div><a href="../">返回原网页</a></section><p id="error" role="alert"></p></main><script type="module" src="team.mjs"></script></body></html>
