<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#287bb9"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.svg"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="login.css"><title>邮箱登录 · 日有所成</title></head><body>
<main class="login-card"><a class="brand" href="./">✳ 日有所成</a><p class="eyebrow">MAKE ROOM FOR PROGRESS</p><h1>每一份完成，<br>都值得被看见。</h1><p>用同一个邮箱账号，在手机和电脑上继续记录。</p>
<div class="tabs" role="group" aria-label="选择登录或注册"><button id="login-tab" aria-pressed="true">邮箱登录</button><button id="register-tab" aria-pressed="false">邀请注册</button></div>
<form id="login-form"><label>邮箱地址<input id="email" type="email" autocomplete="email" maxlength="254" placeholder="请输入邮箱" required></label><label>密码<input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" placeholder="至少 12 个字符，可使用长密码短语" required></label>
<div id="register-fields" hidden><p class="muted">仅限邀请注册，最多 100 个账号；邀请码只在首次注册时使用。</p><label>邀请码<input id="invitation" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="48" pattern="[a-fA-F0-9]{48}" placeholder="请输入邀请人提供的一次性邀请码"></label><label>确认密码<input id="repeat-password" type="password" autocomplete="new-password" minlength="12" maxlength="128"></label><label class="consent"><input id="confirmed" type="checkbox"><span>我已确认邮箱填写正确，并会妥善保管密码。目前暂不发送验证邮件，也不支持邮件找回密码。</span></label></div>
<p id="message" role="alert"></p><button id="login-submit" type="submit" class="primary-button"><span id="submit-label">登录，继续我的记录</span> ↗</button></form>
<p class="muted">首次登录后可迁移旧网页或 GitHub 备份，原记录保留。</p><button id="install-app" class="outline">安装到手机 / 电脑</button><p id="install-status" role="status"></p><a class="muted" href="../">返回原网页版</a></main>
<dialog id="install-guide"><h2>安装日有所成</h2><p>iPhone / iPad：用 Safari 打开，点击“分享”→“添加到主屏幕”。</p><p>安卓：用支持安装应用的浏览器打开，选择“安装应用”或“添加到主屏幕”。</p><p>电脑：在 Edge 或 Chrome 地址栏选择安装图标，或在菜单中选择“安装此网站为应用”。</p><button id="install-close" class="primary-button">知道了</button></dialog>
<script type="module" src="login.mjs"></script></body></html>
